<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LanQuiz</title>
<meta name="description" content="Quiz a risposta multipla: studio, prova d'esame, statistiche. Funziona anche senza rete.">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LanQuiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="btn-back" class="icon-btn" title="Indietro" hidden>&#8592;</button>
  <h1 id="header-title">LanQuiz</h1>
  <div id="header-timer" hidden></div>
  <div class="header-actions" id="header-actions"></div>
</header>

<div id="update-banner" hidden>
  <div>
    <b>Nuova versione disponibile</b>
    <div class="small">Ricarica per aggiornare la web app.</div>
  </div>
  <button id="update-reload">Aggiorna</button>
</div>

<main id="view"></main>

<footer>
  LanQuiz <span id="footer-version"></span> ·
  <a href="https://github.com/zeo93/LanQuiz/releases/latest">app Android</a>
</footer>

<script src="app.js"></script>
</body>
</html>
