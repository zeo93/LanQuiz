<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LanQuiz</title>
<meta name="description" content="Quiz a risposta multipla: studio, prova d'esame, statistiche. Funziona anche senza rete.">
<meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f6f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LanQuiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="btn-back" class="icon-btn" title="Indietro" hidden aria-label="Indietro">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M11 18l-6-6 6-6"></path>
    </svg>
  </button>
  <h1 id="header-title">LanQuiz</h1>
  <div id="header-timer" hidden></div>
  <div class="header-actions" id="header-actions"></div>
</header>

<div id="update-banner" hidden>
  <div>
    <b>Nuova versione disponibile</b>
    <div class="small">Aggiorna per averla adesso.</div>
  </div>
  <button id="update-reload">Aggiorna</button>
  <button id="update-dismiss" class="icon-btn" title="Chiudi">&#215;</button>
</div>

<main id="view"></main>

<footer>
  LanQuiz <span id="footer-version"></span> ·
  <a href="https://github.com/zeo93/LanQuiz/releases/latest">app Android</a>
</footer>

<script src="app.js"></script>
</body>
</html>
