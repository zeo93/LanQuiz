# Pubblica una Release con l'APK firmato quando si spinge un tag vX.Y.
#
# È la strada alternativa a .\rilascia.ps1, che fa la stessa cosa dal PC.
# Serve solo se si vogliono pubblicare le versioni da GitHub: in quel caso
# vanno impostati tre secret (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   il file app/release.keystore codificato base64
#   KEYSTORE_PASSWORD la password dello store
#   KEY_PASSWORD      la password della chiave
# Senza i secret il job non fa nulla e lo dice: pubblicare un APK non firmato
# sarebbe peggio, perché non si installerebbe.
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cerca la chiave di firma
        id: chiave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Nessun secret KEYSTORE_BASE64: la firma da GitHub non è configurata, si pubblica con .\\rilascia.ps1 dal PC."
            echo "pronta=no" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "pronta=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.chiave.outputs.pronta == 'si'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.chiave.outputs.pronta == 'si'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.chiave.outputs.pronta == 'si'

      - name: Prova il lettore dei banchi
        if: steps.chiave.outputs.pronta == 'si'
        run: gradle testReleaseUnitTest

      - name: Compila l'APK di release
        if: steps.chiave.outputs.pronta == 'si'
        env:
          LANQUIZ_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LANQUIZ_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LANQUIZ_KEY_ALIAS: lanquiz
        run: gradle assembleRelease

      - name: Rinomina l'APK con il numero di versione
        id: apk
        if: steps.chiave.outputs.pronta == 'si'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "LanQuiz-${version}.apk"
          echo "path=LanQuiz-${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Pubblica la Release
        if: steps.chiave.outputs.pronta == 'si'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Butta via il keystore
        if: always()
        run: rm -f app/release.keystore
